name: Update CFB DFS Data
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch DraftKings CFB data → drafttable.csv
        run: python fetch_draftkings.py
      - name: Download Google Sheets projections + cheat sheet
        run: |
          # Cheat sheet / player pool (gid 585863704)
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV0x8a_qRCwt9t2MRmRph7MwHioKNrZTN00niOF2spzpMzxrlaz3cKr5oE_soDhjkeH8NbU4UxsIqe/pub?gid=585863704&single=true&output=csv" -o players.csv || true
          # Final projections / matchup sheet (gid 807849522)
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV0x8a_qRCwt9t2MRmRph7MwHioKNrZTN00niOF2spzpMzxrlaz3cKr5oE_soDhjkeH8NbU4UxsIqe/pub?gid=807849522&single=true&output=csv" -o final.csv || true
          # Optional ownership sheet — leave empty file if you add one later
          touch ownership.csv
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafttable.csv players.csv ownership.csv final.csv || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update CFB DFS data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          )
